type IntegrationConnectorCatalogRow {
	id: ID!
	name: String!
	code: String!
	category: String
	authType: String
	isActive: Boolean!
}

type MutationRoot {
	"""
	Send a **FAILED** or **PROCESSING** outbox row back to **PENDING** (same RBAC as `outboxEvents`).
	"""
	requeueOutboxEvent(id: ID!): OutboxEventRow!
	"""
	Connect (or reconnect) an integration connector for this tenant (**HR / directory admins**).
	"""
	connectTenantIntegration(connectorId: ID!): TenantIntegrationRow!
	"""
	Register a webhook subscription (**HR / directory admins**).
	"""
	registerWebhookSubscription(input: RegisterWebhookInput!): WebhookSubscriptionRow!
	setWebhookSubscriptionActive(id: ID!, active: Boolean!): WebhookSubscriptionRow!
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar NaiveDate

type OutboxEventRow {
	id: ID!
	aggregateType: String!
	aggregateId: ID!
	eventType: String!
	payloadJson: String!
	status: String!
	retryCount: Int!
	lastError: String
	createdAt: DateTime!
	processedAt: DateTime
	"""
	Present while the outbox worker holds the row (`PROCESSING`).
	"""
	claimedAt: DateTime
}

type QueryRoot {
	hrReportRows(kind: HrReportKind!, fromDate: NaiveDate!, toDate: NaiveDate!, employeeId: UUID, employeeSearch: String, offset: Int! = 0, limit: Int! = 50): HrReportRows!
	hrReportCsv(kind: HrReportKind!, fromDate: NaiveDate!, toDate: NaiveDate!, employeeId: UUID, employeeSearch: String): HrReportCsv!
	hrInsights(fromDate: NaiveDate!, toDate: NaiveDate!): HrInsights!
	analyticsHealth: String!
	reportDefinitions(limit: Int! = 100): [ReportDefinitionRow!]!
	reportSchedules(limit: Int! = 100): [ReportScheduleRow!]!
	dashboards(limit: Int! = 50): [DashboardRow!]!
	dashboardWidgets(dashboardId: ID, limit: Int! = 100): [DashboardWidgetRow!]!
	workforceSnapshots(limit: Int! = 24): [WorkforceSnapshotRow!]!
	"""
	**HR / directory admins only** — inspect transactional outbox rows (e.g. after leave approval).
	"""
	outboxEvents(status: String, limit: Int! = 100): [OutboxEventRow!]!
	"""
	**HR / directory admins only** — global connector catalogue (ops DB).
	"""
	integrationConnectors(limit: Int! = 100): [IntegrationConnectorCatalogRow!]!
	"""
	**HR / directory admins only** — tenant integration rows.
	"""
	tenantIntegrations(limit: Int! = 100): [TenantIntegrationRow!]!
	"""
	**HR / directory admins only** — outbound webhook subscriptions.
	"""
	webhookSubscriptions(limit: Int! = 100): [WebhookSubscriptionRow!]!
	"""
	**HR / directory admins only** — webhook POST attempts (**`webhook_delivery_log`**), newest first.
	"""
	webhookDeliveryLogs(limit: Int! = 100): [WebhookDeliveryLogRow!]!
	"""
	**HR / directory admins only** — communication/entity audit log (most recent first).
	"""
	auditLogs(limit: Int! = 200): [AuditLogRow!]!
}

input RegisterWebhookInput {
	eventName: String!
	endpointUrl: String!
	"""
	Optional signing secret (**SHA256** stored server-side).
	"""
	webhookSecret: String
}

