	approveSeparation(separationId: ID!): Separation!
	"""
	Reject a pending separation (HR / directory roles).
	"""
	rejectSeparation(separationId: ID!): Separation!
	"""
	HR: fill FNF component amounts (while status is DRAFT). Net payable is recalculated.
	"""
	upsertFnfSettlement(input: UpsertFnfSettlementInput!): FnfSettlement!
	"""
	HR: mark FNF as PROCESSED (no further amount edits).
	"""
	finalizeFnfSettlement(separationId: ID!): FnfSettlement!
