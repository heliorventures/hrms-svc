	deleteEmployeeEducation(employeeId: ID!, educationId: ID!): Boolean!
	linkEmployeeEducationEvidence(employeeId: ID!, educationId: ID!, employeeDocumentId: ID!): EmployeeEducation!
	uploadEmployeeEducationEvidence(educationId: ID!, input: UploadEmployeeDocumentInput!): EmployeeEducation!
	resolveEmployeeEducation(educationId: ID!, approved: Boolean!, rejectionReason: String): EmployeeEducation!
	upsertEmployeeWorkExperience(input: UpsertEmployeeWorkExperienceInput!): EmployeeWorkExperience!
	deleteEmployeeWorkExperience(employeeId: ID!, workExperienceId: ID!): Boolean!
	linkEmployeeWorkExperienceEvidence(employeeId: ID!, workExperienceId: ID!, employeeDocumentId: ID!): EmployeeWorkExperience!
	uploadEmployeeWorkExperienceEvidence(workExperienceId: ID!, input: UploadEmployeeDocumentInput!): EmployeeWorkExperience!
	resolveEmployeeWorkExperience(workExperienceId: ID!, approved: Boolean!, rejectionReason: String): EmployeeWorkExperience!
	"""
	Upsert the primary bank row (self or **`employee:write`**).
	"""
	upsertEmployeePrimaryBank(input: UpsertEmployeePrimaryBankInput!): EmployeeBankAccount!
	"""
	Upsert primary PAN (self or **`employee:write`**). Clears verification until HR re-verifies.
	"""
	upsertEmployeePrimaryPan(input: UpsertEmployeePrimaryPanInput!): EmployeePanRecord!
	"""
	Upsert primary Aadhaar last‑4 (self or **`employee:write`**). Clears verification.
	"""
	upsertEmployeePrimaryAadhaar(input: UpsertEmployeePrimaryAadhaarInput!): EmployeeAadhaarRecord!
	"""
	HR: approve or reject a **`PENDING`** employee document.
	"""
	resolveEmployeeDocument(employeeDocumentId: ID!, approved: Boolean!): EmployeeDocument!
	"""
	Mark an onboarding checklist row complete or incomplete. Employees may update **their own**
	tasks; HR / directory roles may update tasks for employees in their data scope.
	"""
	setOnboardingChecklistItemCompleted(checklistItemId: ID!, isCompleted: Boolean!): OnboardingChecklistItem!
	"""
	File a separation / exit request (self-service, or HR on behalf of another employee).
	"""
	submitSeparation(input: SubmitSeparationInput!): Separation!
	"""
	Approve a pending separation (HR / directory roles — same gate as `createEmployee`).
