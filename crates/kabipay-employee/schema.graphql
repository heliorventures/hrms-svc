	HR: set or update monthly salary for an employee (`employment_history`), effective from a date.
	"""
	setEmployeeCompensation(input: SetEmployeeCompensationInput!): EmploymentHistoryRecord!
	"""
	Upload a file to local `KABIPAY_LOCAL_FILE_ROOT` or object storage and attach `employee_document`.
	**Directory/HR** uploads are **`APPROVED`** immediately; others start **`PENDING`** for HR review.
	"""
	uploadEmployeeDocument(input: UploadEmployeeDocumentInput!): EmployeeDocument!
	"""
	Upload a tenant-scoped file and return its reusable `file_storage.id`.
	"""
	uploadTenantFile(input: UploadTenantFileInput!): UploadedTenantFile!
	"""
	Stage a private company-document upload without exposing `file_storage` metadata.
	"""
	uploadCompanyDocumentFile(input: UploadCompanyDocumentFileInput!): StagedCompanyDocumentUpload!
	"""
	HR/admin: publish a company policy, onboarding, or exit-formality document.
	"""
	createCompanyDocument(input: CreateCompanyDocumentInput!): CompanyDocument!
	"""
	HR/admin: archive a company document without deleting its private file.
	"""
	archiveCompanyDocument(companyDocumentId: ID!): CompanyDocument!
	"""
	HR/admin: permanently delete a company document and durably schedule its private file
	for physical deletion. Use `archiveCompanyDocument` when audit retention is required.
	"""
	deleteCompanyDocument(companyDocumentId: ID!): Boolean!
	"""
	Demographics + emergency contact. Employee may edit **self**; HR may edit anyone in scope.
	"""
	updateEmployeePersonalProfile(input: UpdateEmployeePersonalProfileInput!): Employee!
	"""
	Direct self-service fields that do not change legal identity or organization assignment.
	"""
	updateEmployeeSelfServiceProfile(input: UpdateEmployeeSelfServiceProfileInput!): Employee!
	submitEmployeeProfileChange(input: SubmitEmployeeProfileChangeInput!): EmployeeProfileChangeRequest!
	cancelEmployeeProfileChange(requestId: ID!): EmployeeProfileChangeRequest!
	resolveEmployeeProfileChange(requestId: ID!, approved: Boolean!, rejectionReason: String): EmployeeProfileChangeRequest!
